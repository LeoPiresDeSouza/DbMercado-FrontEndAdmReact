<!doctype html>
<html lang="en">
  <head>
    <title>Typescript Example - Themes - Built In Themes</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <style media="only screen">
      :root,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
      }

      html {
        position: absolute;
        top: 0;
        left: 0;
        padding: 0;
        overflow: auto;
        font-family: -apple-system, "system-ui", "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif,
          "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol",
          "Noto Color Emoji";
      }

      body {
        padding: 16px;
        overflow: auto;
        background-color: transparent;
      }

      /* Hide codesandbox highlighter */
      body > #highlighter {
        display: none;
      }
    </style>
  </head>
  <body>
    <div style="height: 100%; display: flex; flex-direction: column">
      <p style="flex: 0 1 0%">
        Theme:
        <select style="margin-right: 16px" onchange="setBaseTheme(this.value)">
          <option value="quartz">themeQuartz</option>
          <option value="balham">themeBalham</option>
          <option value="material">themeMaterial</option>
          <option value="alpine">themeAlpine</option>
        </select>
      </p>
      <div style="flex: 1 1 0%">
        <div id="myGrid" style="height: 100%"></div>
      </div>
    </div>
    <script>
      (function () {
        const appLocation = "";

        window.__basePath = appLocation;
      })();
    </script>
    <script>
      var appLocation = "";
      var boilerplatePath = "";
      var startFile = "main.ts";
      var systemJsMap = {
        "@ag-grid-community/styles":
          "https://cdn.jsdelivr.net/npm/@ag-grid-community/styles@35.2.0",
        "ag-grid-community":
          "https://cdn.jsdelivr.net/npm/ag-grid-community@35.2.0",
        "ag-grid-enterprise":
          "https://cdn.jsdelivr.net/npm/ag-grid-enterprise@35.2.0/",
      };
      var systemJsPaths = {
        "@ag-grid-community/locale":
          "https://cdn.jsdelivr.net/npm/@ag-grid-community/locale@35.2.0/dist/package/main.cjs.js",
        "ag-charts-community":
          "https://cdn.jsdelivr.net/npm/ag-charts-community@13.2.0/dist/package/main.cjs.js",
        "ag-charts-core":
          "https://cdn.jsdelivr.net/npm/ag-charts-core@13.2.0/dist/package/main.cjs.js",
        "ag-charts-enterprise":
          "https://cdn.jsdelivr.net/npm/ag-charts-enterprise@13.2.0/dist/package/main.cjs.js",
        "ag-charts-types":
          "https://cdn.jsdelivr.net/npm/ag-charts-types@13.2.0/",
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/systemjs@0.19.47/dist/system.js"></script>
    <script src="systemjs.config.js"></script>
  </body>
</html>
